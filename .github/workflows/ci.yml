name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Enabled once the switch/ project lands (M4).
  switch:
    if: ${{ hashFiles('switch/CMakeLists.txt') != '' }}
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -B switch/build -S switch -DPLATFORM_SWITCH=ON
      - run: cmake --build switch/build --target nslibrary.nro -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: nslibrary.nro
          path: switch/build/nslibrary.nro
