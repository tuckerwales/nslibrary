name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Switch host tests
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libzstd-dev pkg-config
          cmake -B switch/build-host -S switch
          cmake --build switch/build-host --target nslib-switch-tests -j"$(nproc)"
          switch/build-host/nslib-switch-tests

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build the installers
        # AppImage and deb on Linux, dmg (x64 and arm64) on macOS, NSIS on Windows. Unsigned: no
        # signing certificates are configured.
        run: pnpm --filter @nslib/desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Start the packaged app
        # Only Linux runners have a virtual display to start it on.
        if: runner.os == 'Linux'
        run: |
          profile="$(mktemp -d)"
          xvfb-run -a packages/electron/dist/linux-unpacked/nslibrary --no-sandbox \
            --user-data-dir="$profile" > desktop.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8465/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8465/api/v1/auth/status
          curl -sf http://127.0.0.1:8465/ | grep -q "<title>NSLibrary"
      - name: Log on failure
        if: failure() && runner.os == 'Linux'
        run: cat desktop.log
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            packages/electron/dist/NSLibrary-*.AppImage
            packages/electron/dist/NSLibrary-*.deb
            packages/electron/dist/NSLibrary-*.dmg
            packages/electron/dist/NSLibrary-*.exe
          if-no-files-found: error
          retention-days: 7

  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check Switch portlibs
        # The image already ships every portlib the app needs, so only the local database is
        # queried: pkg.devkitpro.org can refuse CI runners (403). A missing one fails here by name.
        run: |
          dkp-pacman -Q \
            switch-pkg-config switch-freetype switch-harfbuzz switch-libwebp \
            switch-glfw switch-mesa switch-libdrm_nouveau \
            switch-curl switch-mbedtls switch-libzstd switch-glm switch-libpng switch-zlib
      - run: cmake -B switch/build -S switch -DPLATFORM_SWITCH=ON
      - run: cmake --build switch/build --target nslibrary.nro -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: nslibrary.nro
          path: switch/build/nslibrary.nro

  docker:
    runs-on: ubuntu-latest
    env:
      # First-run setup needs a token; pinning one here lets the smoke test create the admin.
      NSLIB_SETUP_TOKEN: ci-smoke-setup-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and start
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Device-sim against the container
        run: node scripts/docker-smoke.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
