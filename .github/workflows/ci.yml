name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Switch host tests
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libzstd-dev pkg-config
          cmake -B switch/build-host -S switch
          cmake --build switch/build-host --target nslib-switch-tests -j"$(nproc)"
          switch/build-host/nslib-switch-tests

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build the installers
        # AppImage and deb on Linux, dmg (x64 and arm64) on macOS, NSIS on Windows. No signing
        # certificates are configured: the macOS apps are signed ad-hoc, the rest not at all.
        run: pnpm --filter @nslib/desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Sign (ad-hoc) on pull requests too, so CI builds exactly what a release does.
          CSC_FOR_PULL_REQUEST: "true"
      - name: Start the packaged app
        shell: bash
        working-directory: packages/electron
        run: |
          case "$RUNNER_OS" in
            Linux) xvfb-run -a node scripts/smoke.mjs dist/linux-unpacked/nslibrary ;;
            macOS)
              # The runner is Apple silicon, so the Intel app can only have its signature checked.
              codesign --verify --deep --strict dist/mac/NSLibrary.app
              codesign --verify --deep --strict dist/mac-arm64/NSLibrary.app
              node scripts/smoke.mjs dist/mac-arm64/NSLibrary.app/Contents/MacOS/NSLibrary ;;
            Windows) node scripts/smoke.mjs dist/win-unpacked/NSLibrary.exe ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            packages/electron/dist/NSLibrary-*.AppImage
            packages/electron/dist/NSLibrary-*.deb
            packages/electron/dist/NSLibrary-*.dmg
            packages/electron/dist/NSLibrary-*.exe
          if-no-files-found: error
          retention-days: 7

  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check Switch portlibs
        # The image already ships every portlib the app needs, so only the local database is
        # queried: pkg.devkitpro.org can refuse CI runners (403). A missing one fails here by name.
        run: |
          dkp-pacman -Q \
            switch-pkg-config switch-freetype switch-harfbuzz switch-libwebp \
            switch-glfw switch-mesa switch-libdrm_nouveau \
            switch-curl switch-mbedtls switch-libzstd switch-glm switch-libpng switch-zlib
      - run: cmake -B switch/build -S switch -DPLATFORM_SWITCH=ON
      - run: cmake --build switch/build --target nslibrary.nro -j"$(nproc)"
      - uses: actions/upload-artifact@v7
        with:
          name: nslibrary.nro
          path: switch/build/nslibrary.nro

  docker:
    runs-on: ubuntu-latest
    env:
      # First-run setup needs a token; pinning one here lets the smoke test create the admin.
      NSLIB_SETUP_TOKEN: ci-smoke-setup-token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and start
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Device-sim against the container
        run: node scripts/docker-smoke.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
