name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check Switch portlibs
        # The image already ships every portlib the app needs, so only the local database is
        # queried: pkg.devkitpro.org can refuse CI runners (403). A missing one fails here by name.
        run: |
          dkp-pacman -Q \
            switch-pkg-config switch-freetype switch-harfbuzz switch-libwebp \
            switch-glfw switch-mesa switch-libdrm_nouveau \
            switch-curl switch-mbedtls switch-libzstd switch-glm switch-libpng switch-zlib
      - run: cmake -B switch/build -S switch -DPLATFORM_SWITCH=ON
      - run: cmake --build switch/build --target nslibrary.nro -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: nslibrary.nro
          path: switch/build/nslibrary.nro

  sign:
    needs: switch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: nslibrary.nro
          path: dist
      - name: Sign the .nro
        env:
          NSLIB_UPDATE_SK: ${{ secrets.NSLIB_UPDATE_SK }}
        run: |
          if [ -z "$NSLIB_UPDATE_SK" ]; then
            echo "Add repository secret NSLIB_UPDATE_SK (32-byte Ed25519 seed as hex)."
            echo "Generate one with: node scripts/gen-update-keys.mjs"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/sign-update.mjs dist/nslibrary.nro --out dist --version "$VERSION"
      - name: Collect licence notices
        # The .nro links borealis (Apache-2.0) and vendors TweetNaCl, so attribution travels with
        # every binary we publish.
        run: cp LICENSE NOTICE THIRD-PARTY.md dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/nslibrary.nro \
            dist/update.json \
            dist/update.json.sig \
            dist/LICENSE \
            dist/NOTICE \
            dist/THIRD-PARTY.md \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  desktop:
    # After the release exists, so a failed desktop build never holds back the .nro.
    needs: sign
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build the installers
        shell: bash
        # Versioned from the tag, not packages/electron/package.json. No signing certificates are
        # configured: the macOS apps are signed ad-hoc, the rest not at all.
        run: pnpm --filter @nslib/desktop dist -c.extraMetadata.version="${GITHUB_REF_NAME#v}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Start the packaged app before publishing it
        shell: bash
        working-directory: packages/electron
        run: |
          case "$RUNNER_OS" in
            Linux) xvfb-run -a node scripts/smoke.mjs dist/linux-unpacked/nslibrary ;;
            macOS)
              # The runner is Apple silicon, so the Intel app can only have its signature checked.
              codesign --verify --deep --strict dist/mac/NSLibrary.app
              codesign --verify --deep --strict dist/mac-arm64/NSLibrary.app
              node scripts/smoke.mjs dist/mac-arm64/NSLibrary.app/Contents/MacOS/NSLibrary ;;
            Windows) node scripts/smoke.mjs dist/win-unpacked/NSLibrary.exe ;;
          esac
      - name: Attach to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(packages/electron/dist/NSLibrary-*.{AppImage,deb,dmg,exe})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were built"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
