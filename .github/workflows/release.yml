name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Switch portlibs
        run: |
          pacman -Sy --noconfirm --needed \
            switch-pkg-config switch-freetype switch-harfbuzz switch-libwebp \
            switch-glfw switch-mesa switch-libdrm_nouveau \
            switch-curl switch-mbedtls switch-zstd switch-glm switch-libpng switch-zlib
      - run: cmake -B switch/build -S switch -DPLATFORM_SWITCH=ON
      - run: cmake --build switch/build --target nslibrary.nro -j"$(nproc)"
      - uses: actions/upload-artifact@v7
        with:
          name: nslibrary.nro
          path: switch/build/nslibrary.nro

  sign:
    needs: switch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: nslibrary.nro
          path: dist
      - name: Sign the .nro
        env:
          NSLIB_UPDATE_SK: ${{ secrets.NSLIB_UPDATE_SK }}
        run: |
          if [ -z "$NSLIB_UPDATE_SK" ]; then
            echo "Add repository secret NSLIB_UPDATE_SK (32-byte Ed25519 seed as hex)."
            echo "Generate one with: node scripts/gen-update-keys.mjs"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/sign-update.mjs dist/nslibrary.nro --out dist --version "$VERSION"
      - name: Collect licence notices
        # The .nro links borealis (Apache-2.0) and vendors TweetNaCl, so attribution travels with
        # every binary we publish.
        run: cp LICENSE NOTICE THIRD-PARTY.md dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/nslibrary.nro \
            dist/update.json \
            dist/update.json.sig \
            dist/LICENSE \
            dist/NOTICE \
            dist/THIRD-PARTY.md \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
